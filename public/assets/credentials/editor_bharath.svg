<svg xmlns="http://www.w3.org/2000/svg" width="450" height="488" viewBox="0 0 450 488">
  <!-- Placeholder portrait for an editor without a photo: neon silhouette in the editing team's orange. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0f24"/>
      <stop offset="1" stop-color="#07050d"/>
    </linearGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2130"/>
      <stop offset="1" stop-color="#170d18"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#f97316" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="450" height="488" fill="url(#bg)"/>
  <rect width="450" height="488" fill="url(#grid)"/>
  <g filter="url(#glow)" stroke="#fb923c" stroke-width="3" fill="url(#fig)">
    <circle cx="225" cy="175" r="82"/>
    <path d="M60 488c0-104 70-178 165-178s165 74 165 178z"/>
  </g>
  <text x="225" y="200" text-anchor="middle" font-family="Orbitron, 'Segoe UI', sans-serif" font-size="72" font-weight="700" fill="#fdba74" filter="url(#glow)">B</text>
</svg>
